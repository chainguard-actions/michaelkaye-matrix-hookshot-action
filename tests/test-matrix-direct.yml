name: Test with matrix access token and room id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          text_template: "{{#each job_statuses}}{{name}}: {{conclusion}}{{/each}}"
          html_template: "<p>{{#each job_statuses}}{{name}}: {{conclusion}}{{/each}}</p>"
          matrix_access_token: "syt_invalid_test_token"
          matrix_room_id: "!invalidroom:example.invalid"
      - name: Assert action ran (succeeded, or failed gracefully on the sentinel repo / invalid matrix creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with matrix access token and room id"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo jobs API not resolvable / fake matrix credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
